<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6ff">
  <title>Orbit — Space Exploration Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f5ff;
      --card: #fff;
      --ink: #20233d;
      --muted: #777b98;
      --line: #e8e9f4;
      --purple: #7158e8;
      --purple-soft: #f0edff;
      --green: #168852;
      --green-bg: #e9f8ef;
      --red: #d44758;
      --red-bg: #fff0f1;
      --shadow: 0 22px 70px rgb(49 46 97 / 10%);
      --panel-glow: rgb(113 88 232 / 8%);
      --panel-grid: rgb(113 88 232 / 3%);
      --hud-line: #cfd2e9;
      --hud-accent: #7158e8;
      --star-color: rgb(103 96 174 / 28%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111322;
        --card: #1c1e31;
        --ink: #f1f1fb;
        --muted: #a1a3bd;
        --line: #32344a;
        --purple: #a394ff;
        --purple-soft: #2b2745;
        --green: #62d995;
        --green-bg: #1c382d;
        --red: #ff8490;
        --red-bg: #45252e;
        --shadow: 0 22px 70px rgb(0 0 0 / 24%);
        --panel-glow: rgb(163 148 255 / 11%);
        --panel-grid: rgb(163 148 255 / 4%);
        --hud-line: #494b69;
        --hud-accent: #a394ff;
        --star-color: rgb(190 183 255 / 38%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 18px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 12% 12%, rgb(139 122 255 / 12%), transparent 32rem),
        radial-gradient(ellipse at 90% 85%, rgb(74 204 190 / 10%), transparent 28rem),
        var(--page);
      color: var(--ink);
      font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      position: fixed;
      z-index: 0;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 8% 18%, var(--star-color) 99%, transparent),
        radial-gradient(1px 1px at 22% 74%, var(--star-color) 99%, transparent),
        radial-gradient(1.5px 1.5px at 37% 36%, var(--star-color) 99%, transparent),
        radial-gradient(1px 1px at 51% 87%, var(--star-color) 99%, transparent),
        radial-gradient(1px 1px at 66% 15%, var(--star-color) 99%, transparent),
        radial-gradient(1.5px 1.5px at 79% 62%, var(--star-color) 99%, transparent),
        radial-gradient(1px 1px at 93% 31%, var(--star-color) 99%, transparent);
      content: "";
      opacity: .7;
      pointer-events: none;
      animation: star-drift 36s ease-in-out infinite alternate;
    }

    button { font: inherit; }

    .quiz {
      width: min(100%, 560px);
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: linear-gradient(145deg, #927eff, #5d45d7);
      color: white;
      font-size: 17px;
      box-shadow: 0 5px 14px rgb(113 88 232 / 28%);
    }

    .card {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 30px 34px 28px;
      border: 1px solid var(--hud-line);
      border-radius: 20px;
      background:
        repeating-linear-gradient(0deg, transparent 0 47px, var(--panel-grid) 48px),
        repeating-linear-gradient(90deg, transparent 0 47px, var(--panel-grid) 48px),
        radial-gradient(ellipse at 50% -12%, var(--panel-glow), transparent 54%),
        var(--card);
      box-shadow: var(--shadow), inset 0 1px 0 rgb(255 255 255 / 55%), inset 0 0 0 1px rgb(255 255 255 / 20%);
    }

    .card::before {
      position: absolute;
      z-index: -1;
      top: 0;
      right: 0;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #4fc7c0 0%, var(--hud-accent) 48%, #c579ed 100%);
      content: "";
    }

    .card::after {
      position: absolute;
      z-index: -1;
      inset: 10px;
      border-radius: 12px;
      background:
        linear-gradient(var(--hud-accent), var(--hud-accent)) left top / 15px 2px no-repeat,
        linear-gradient(var(--hud-accent), var(--hud-accent)) left top / 2px 15px no-repeat,
        linear-gradient(var(--hud-accent), var(--hud-accent)) right top / 15px 2px no-repeat,
        linear-gradient(var(--hud-accent), var(--hud-accent)) right top / 2px 15px no-repeat,
        linear-gradient(var(--hud-accent), var(--hud-accent)) left bottom / 15px 2px no-repeat,
        linear-gradient(var(--hud-accent), var(--hud-accent)) left bottom / 2px 15px no-repeat,
        linear-gradient(var(--hud-accent), var(--hud-accent)) right bottom / 15px 2px no-repeat,
        linear-gradient(var(--hud-accent), var(--hud-accent)) right bottom / 2px 15px no-repeat;
      content: "";
      opacity: .38;
      pointer-events: none;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .045em;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: color-mix(in srgb, var(--purple-soft) 62%, var(--card));
      font-variant-numeric: tabular-nums;
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 5%);
    }

    .progress-track {
      height: 8px;
      overflow: hidden;
      border: 1px solid var(--hud-line);
      border-radius: 99px;
      background: var(--line);
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 8%);
    }

    .progress-fill {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #35b9b0, #765eeb 58%, #bb72ec);
      box-shadow: 0 0 10px color-mix(in srgb, var(--hud-accent) 45%, transparent);
      transition: width .45s cubic-bezier(.2,.75,.25,1);
    }

    .question-area { padding: 29px 0 20px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-shadow: 0 0 16px var(--panel-glow);
    }

    h1, h2 {
      margin: 0;
      font-size: clamp(22px, 5vw, 28px);
      line-height: 1.25;
      letter-spacing: -.035em;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
      min-height: 53px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      text-align: left;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--purple);
      box-shadow: 0 5px 16px rgb(113 88 232 / 10%);
    }

    .answer:focus-visible, .primary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--purple) 45%, transparent);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .letter {
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--page);
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .answer.correct {
      border-color: var(--green);
      background: var(--green-bg);
      animation: pop .38s ease both;
    }

    .answer.correct .letter { background: var(--green); color: white; }
    .answer.wrong {
      border-color: var(--red);
      background: var(--red-bg);
      animation: shake .38s ease both;
    }
    .answer.wrong .letter { background: var(--red); color: white; }
    .answer.reveal { border-color: var(--green); }
    .answer.reveal .letter { background: var(--green-bg); color: var(--green); }

    .feedback {
      min-height: 25px;
      margin: 13px 0 0;
      font-size: 13px;
      font-weight: 650;
    }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 11px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .hint { color: var(--muted); font-size: 12px; }

    .primary {
      min-width: 120px;
      padding: 11px 18px;
      border: 0;
      border-radius: 12px;
      background: var(--purple);
      color: #fff;
      font-weight: 720;
      cursor: pointer;
      box-shadow: 0 6px 15px rgb(113 88 232 / 20%);
      transition: transform .18s ease, filter .18s ease;
    }
    .primary:hover { transform: translateY(-1px); filter: brightness(1.08); }
    .primary:active { transform: translateY(0); }
    .primary:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

    .results {
      padding: 22px 0 6px;
      text-align: center;
    }

    .reaction {
      width: 96px;
      height: 96px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 30px;
      background: var(--purple-soft);
      font-size: 52px;
      animation: float 2.8s ease-in-out infinite;
    }
    .results h1 { margin-bottom: 8px; }
    .results-copy { margin: 0 auto 21px; color: var(--muted); }
    .result-recap {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 0 0 24px;
    }
    .result-stat {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: color-mix(in srgb, var(--purple-soft) 42%, var(--card));
    }
    .result-stat dt { color: var(--muted); font-size: 13px; font-weight: 650; }
    .result-stat dd {
      margin: 2px 0 0;
      color: var(--purple);
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.04em;
      font-variant-numeric: tabular-nums;
    }
    .result-stat dd strong { font-weight: inherit; }
    .result-stat dd span { color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: 0; }
    .results .primary { display: block; width: 100%; }

    .confetti {
      position: absolute;
      z-index: 2;
      top: 16px;
      left: 50%;
      pointer-events: none;
      animation: burst 1.1s ease-out forwards;
      font-size: 22px;
    }

    [hidden] { display: none !important; }

    @keyframes pop {
      0% { transform: scale(.97); }
      55% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    @keyframes burst {
      0% { opacity: 0; transform: translate(-50%, 5px) scale(.4) rotate(-15deg); }
      25% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), var(--dy)) scale(1.15) rotate(25deg); }
    }
    @keyframes star-drift {
      from { opacity: .48; transform: translateY(0); }
      to { opacity: .78; transform: translateY(-4px); }
    }

    @media (max-width: 480px) {
      body { padding: 20px 13px; }
      .card { padding: 24px 20px 21px; border-radius: 20px; }
      .question-area { padding-top: 24px; }
      .hint { max-width: 145px; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz" aria-label="Space exploration quiz">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Orbit · Space Quiz</div>
    <section class="card" aria-live="polite">
      <div id="quiz-view">
        <div class="topline">
          <span id="question-count">Question 1 of 10</span>
          <span class="score" aria-label="Current score">⭐ <span id="score">0</span></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="1">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="question-area">
          <p class="eyebrow" id="category">The solar system</p>
          <h1 id="question"></h1>
        </div>
        <div class="answers" id="answers"></div>
        <p class="feedback" id="feedback" aria-live="assertive"></p>
        <div class="footer">
          <span class="hint" id="hint">Choose the best answer to continue</span>
          <button class="primary" id="next" type="button" disabled>Check answer</button>
        </div>
      </div>
      <div class="results" id="results" hidden>
        <div class="reaction" id="reaction" aria-hidden="true">🚀</div>
        <p class="eyebrow">Mission complete</p>
        <h1 id="result-title">Out of this world!</h1>
        <p class="results-copy" id="result-copy"></p>
        <dl class="result-recap" aria-label="Answer recap">
          <div class="result-stat">
            <dt>Correct</dt>
            <dd><strong id="final-score">0</strong><span> / 10</span></dd>
          </div>
          <div class="result-stat">
            <dt>Incorrect</dt>
            <dd><strong id="incorrect-score">10</strong><span> / 10</span></dd>
          </div>
        </dl>
        <button class="primary" id="restart" type="button">Play again ↻</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      { category: "The solar system", question: "Which planet is known as the Red Planet?", options: ["Venus", "Mars", "Jupiter", "Mercury"], answer: 1, fact: "Mars gets its rusty color from iron-rich dust on its surface." },
      { category: "Moon missions", question: "Who was the first person to walk on the Moon?", options: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "Michael Collins"], answer: 2, fact: "Neil Armstrong stepped onto the lunar surface on July 20, 1969." },
      { category: "Stargazing", question: "What is the name of the galaxy we call home?", options: ["Andromeda", "The Milky Way", "Whirlpool", "Sombrero"], answer: 1, fact: "Our solar system sits in one of the Milky Way's spiral arms." },
      { category: "The solar system", question: "Which planet has the most prominent ring system?", options: ["Neptune", "Uranus", "Saturn", "Jupiter"], answer: 2, fact: "Saturn's rings are made mostly of countless pieces of ice and rock." },
      { category: "Deep space", question: "What does a light-year measure?", options: ["Time", "Brightness", "Distance", "Temperature"], answer: 2, fact: "A light-year is how far light travels in one year—about 9.46 trillion km." },
      { category: "Space technology", question: "Which telescope launched in 2021 to study the early universe?", options: ["Hubble", "Kepler", "James Webb", "Chandra"], answer: 2, fact: "The James Webb Space Telescope observes the universe in infrared light." },
      { category: "The solar system", question: "Which planet is the largest in our solar system?", options: ["Saturn", "Earth", "Jupiter", "Neptune"], answer: 2, fact: "Jupiter is so large that more than 1,300 Earths could fit inside it." },
      { category: "Space history", question: "What was the first artificial satellite sent into orbit?", options: ["Explorer 1", "Sputnik 1", "Vostok 1", "Luna 2"], answer: 1, fact: "The Soviet Union launched Sputnik 1 in 1957." },
      { category: "Beyond Earth", question: "What is the name of NASA's robotic rover currently exploring Mars (landed 2021)?", options: ["Curiosity", "Spirit", "Perseverance", "Opportunity"], answer: 2, fact: "Perseverance is collecting samples and searching for signs of ancient life." },
      { category: "The solar system", question: "Which planet rotates on its side, with an extreme axial tilt?", options: ["Uranus", "Venus", "Mars", "Saturn"], answer: 0, fact: "Uranus tilts about 98 degrees, likely due to a massive ancient collision." }
    ];

    const quizView = document.querySelector("#quiz-view");
    const resultsView = document.querySelector("#results");
    const questionCount = document.querySelector("#question-count");
    const scoreDisplay = document.querySelector("#score");
    const progress = document.querySelector(".progress-track");
    const progressFill = document.querySelector("#progress-fill");
    const category = document.querySelector("#category");
    const questionTitle = document.querySelector("#question");
    const answers = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next");
    const hint = document.querySelector("#hint");
    let current = 0;
    let score = 0;
    let locked = false;

    function renderQuestion() {
      const item = questions[current];
      questionCount.textContent = `Question ${current + 1} of ${questions.length}`;
      scoreDisplay.textContent = score;
      category.textContent = item.category;
      questionTitle.textContent = item.question;
      progressFill.style.width = `${((current + 1) / questions.length) * 100}%`;
      progress.setAttribute("aria-valuenow", current + 1);
      feedback.textContent = "";
      feedback.className = "feedback";
      hint.textContent = "Choose the best answer to continue";
      nextButton.disabled = true;
      nextButton.textContent = "Check answer";
      locked = false;
      answers.replaceChildren();

      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.setAttribute("aria-label", `${String.fromCharCode(65 + index)}: ${option}`);
        const letter = document.createElement("span");
        letter.className = "letter";
        letter.setAttribute("aria-hidden", "true");
        letter.textContent = String.fromCharCode(65 + index);
        const text = document.createElement("span");
        text.textContent = option;
        button.append(letter, text);
        button.addEventListener("click", () => chooseAnswer(index, button));
        answers.append(button);
      });
    }

    function chooseAnswer(index, selected) {
      if (locked) return;
      locked = true;
      const item = questions[current];
      const buttons = [...answers.children];
      buttons.forEach(button => { button.disabled = true; });

      if (index === item.answer) {
        score += 1;
        scoreDisplay.textContent = score;
        selected.classList.add("correct");
        feedback.textContent = `Brilliant! ${item.fact}`;
        feedback.classList.add("good");
        celebrate();
      } else {
        selected.classList.add("wrong");
        buttons[item.answer].classList.add("reveal");
        feedback.textContent = `Not quite. ${item.fact}`;
        feedback.classList.add("bad");
      }

      hint.textContent = index === item.answer ? "Nice navigation, astronaut!" : "Keep exploring—you've got this";
      nextButton.disabled = false;
      nextButton.textContent = current === questions.length - 1 ? "See results" : "Next question";
      nextButton.focus({ preventScroll: true });
    }

    function celebrate() {
      const pieces = ["✦", "✧", "✦", "★", "✧"];
      pieces.forEach((symbol, index) => {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.setAttribute("aria-hidden", "true");
        piece.textContent = symbol;
        piece.style.color = ["#ffb84d", "#55c9ad", "#ae7af2", "#ff7183", "#6f9cff"][index];
        piece.style.setProperty("--dx", `${(index - 2) * 28}px`);
        piece.style.setProperty("--dy", `${-40 - (index % 2) * 24}px`);
        document.querySelector(".quiz").append(piece);
        window.setTimeout(() => piece.remove(), 1200);
      });
    }

    function showResults() {
      quizView.hidden = true;
      resultsView.hidden = false;
      document.querySelector("#final-score").textContent = score;
      document.querySelector("#incorrect-score").textContent = questions.length - score;
      const percent = score / questions.length;
      let emoji, title, copy;
      if (percent === 1) {
        emoji = "🏆"; title = "Cosmic genius!";
        copy = "A perfect mission. You know your way around the universe!";
      } else if (percent >= .7) {
        emoji = "🚀"; title = "Out of this world!";
        copy = "Fantastic exploring. The cosmos is lucky to have you.";
      } else if (percent >= .4) {
        emoji = "🪐"; title = "Stellar effort!";
        copy = "You’re building your space knowledge one orbit at a time.";
      } else {
        emoji = "🌟"; title = "Keep reaching for the stars!";
        copy = "Every astronaut starts somewhere. Ready for another mission?";
      }
      document.querySelector("#reaction").textContent = emoji;
      document.querySelector("#result-title").textContent = title;
      document.querySelector("#result-copy").textContent = copy;
      document.querySelector("#restart").focus({ preventScroll: true });
    }

    nextButton.addEventListener("click", () => {
      if (!locked) return;
      if (current === questions.length - 1) {
        showResults();
      } else {
        current += 1;
        renderQuestion();
        questionTitle.setAttribute("tabindex", "-1");
        questionTitle.focus({ preventScroll: true });
      }
    });

    document.querySelector("#restart").addEventListener("click", () => {
      current = 0;
      score = 0;
      resultsView.hidden = true;
      quizView.hidden = false;
      renderQuestion();
      questionTitle.setAttribute("tabindex", "-1");
      questionTitle.focus({ preventScroll: true });
    });

    renderQuestion();
  </script>
</body>
</html>
